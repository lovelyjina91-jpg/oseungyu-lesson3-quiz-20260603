  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function render() {
  if (current >= QUESTIONS.length) { renderResult(); return; }
  const q = QUESTIONS[current];
  progressBar.style.width = ((current) / QUESTIONS.length * 100) + '%';
  selectedOption = answers[current];

  let html = `
    <div class="quiz-body">
      <span class="qnum">문제 ${current + 1} / ${QUESTIONS.length}</span>
      <span class="qtype">${q.typeLabel}</span>
      <div class="question">${q.q}</div>
  `;

  if (q.type === 'mc') {
    html += '<div class="options" id="options">';
    q.options.forEach((opt, i) => {
      html += `<button class="option ${selectedOption === i ? 'selected' : ''}" data-idx="${i}">
        <span class="key">${i + 1}</span><span>${opt}</span>
      </button>`;
    });
    html += '</div>';
  } else {
    const val = answers[current] || '';
    if (q.type === 'order') {
      html += `<textarea class="text-input" id="textInput" placeholder="여기에 영어 문장을 입력하세요...">${val}</textarea>`;
    } else {
      html += `<input type="text" class="text-input" id="textInput" placeholder="여기에 답을 입력하세요..." value="${val}">`;
    }
  }

  html += `
      <div class="btn-row">
        <button class="btn btn-ghost" id="prevBtn" ${current === 0 ? 'style="visibility:hidden"' : ''}>← 이전</button>
        <button class="btn btn-primary" id="nextBtn">${current === QUESTIONS.length - 1 ? '제출하기' : '다음 →'}</button>
      </div>
      <div class="keyboard-hint">
        💡 <kbd>Enter</kbd> 다음 ${q.type === 'mc' ? '· <kbd>1</kbd>~<kbd>4</kbd> 선택' : ''}
      </div>
    </div>
  `;

  content.innerHTML = html;

  if (q.type === 'mc') {
    document.querySelectorAll('.option').forEach(btn => {
      btn.addEventListener('click', () => selectMC(parseInt(btn.dataset.idx)));
    });
  } else {
    const ti = $('textInput');
    ti.focus();
    ti.addEventListener('input', e => { answers[current] = e.target.value; });
  }

  $('nextBtn').addEventListener('click', goNext);
  if (current > 0) $('prevBtn').addEventListener('click', goPrev);
}

function selectMC(idx) {
  selectedOption = idx;
  answers[current] = idx;
  document.querySelectorAll('.option').forEach((el, i) => {
    el.classList.toggle('selected', i === idx);
  });
}

function goNext() {
  const q = QUESTIONS[current];
  if (q.type === 'mc') {
    if (answers[current] === null) { showToast('답을 선택해주세요!'); return; }
  } else {
    const v = ($('textInput').value || '').trim();
    if (!v) { showToast('답을 입력해주세요!'); return; }
    answers[current] = v;
  }
  current++;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goPrev() {
  if (current > 0) { current--; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
}

document.addEventListener('keydown', e => {
  if (current >= QUESTIONS.length) return;
  const q = QUESTIONS[current];
  if (e.key === 'Enter') {
    if (q.type === 'order' && !e.ctrlKey) {
      // textarea: Ctrl+Enter to submit, Enter for newline
      if (e.target.tagName === 'TEXTAREA') return;
    }
    e.preventDefault();
    goNext();
  } else if (q.type === 'mc' && ['1','2','3','4'].includes(e.key)) {
    const idx = parseInt(e.key) - 1;
    if (idx < q.options.length) selectMC(idx);
  }
});

function checkAnswer(q, userAns) {
  if (q.type === 'mc') return userAns === q.answer;
  const u = normalize(userAns);
  return q.answer.some(a => normalize(a) === u);
}

function renderResult() {
  progressBar.style.width = '100%';
  let correct = 0;
  const items = QUESTIONS.map((q, i) => {
    const ok = checkAnswer(q, answers[i]);
    if (ok) correct++;
    return { q, idx: i, userAns: answers[i], ok };
  });

  let html = `
    <div class="result-header">
      <div class="score-circle">${correct}/${QUESTIONS.length}</div>
      <div class="result-title">${STUDENT_NAME} 학생, 결과입니다!</div>
      <div class="result-subtitle">정답률 ${Math.round(correct / QUESTIONS.length * 100)}%</div>
    </div>
    <div class="result-list">
  `;

  items.forEach(({ q, idx, userAns, ok }) => {
    const userDisplay = q.type === 'mc'
      ? (userAns !== null ? `${userAns + 1}. ${q.options[userAns]}` : '(미응답)')
      : (userAns || '(미응답)');
    const correctDisplay = q.type === 'mc'
      ? `${q.answer + 1}. ${q.options[q.answer]}`
      : q.answer.join(' / ');

    html += `
      <div class="result-item ${ok ? 'correct' : 'wrong'}">
        <span class="badge ${ok ? 'ok' : 'no'}">${ok ? '✓ 정답' : '✗ 오답'}</span>
        <span class="qnum">문제 ${idx + 1}</span>
        <span class="qtype">${q.typeLabel}</span>
        <div class="q" style="margin-top:8px">${q.q}</div>
        <div class="ans-row"><span class="label">내 답:</span><span class="${ok ? 'correct-text' : 'user'}">${userDisplay}</span></div>
        ${ok ? '' : `<div class="ans-row"><span class="label">정답:</span><span class="correct-text">${correctDisplay}</span></div>`}
        <div class="explain"><b>해설:</b> ${q.explain}</div>
      </div>
    `;
  });

  html += `
    </div>
    <div class="action-row">
      <button class="btn-kakao" id="copyBtn">📋 지나티처에게 보낼 결과 메세지 복사하기</button>
      <button class="btn btn-ghost" id="retryBtn">🔄 다시 풀기</button>
    </div>
    <div class="closing">수고했습니당 ~~~ ㅎㅎㅎ 🎉</div>
  `;

  content.innerHTML = html;

  $('copyBtn').addEventListener('click', () => copyKakao(items, correct));
  $('retryBtn').addEventListener('click', () => {
    current = 0;
    answers = new Array(QUESTIONS.length).fill(null);
    render();
  });
}

function copyKakao(items, correct) {
  const wrongs = items.filter(x => !x.ok);
  let msg = `🌟 [Lesson 3 The Ig Nobel Prize 변형문제 결과]\n\n`;
  msg += `👤 학생: ${STUDENT_NAME}\n`;
  msg += `📊 점수: ${correct}/${QUESTIONS.length} (${Math.round(correct/QUESTIONS.length*100)}%)\n`;
  msg += `❌ 틀린 문제: ${wrongs.length}개\n\n`;
  if (wrongs.length > 0) {
    msg += `[틀린 문제 목록]\n`;
    wrongs.forEach(({ q, idx, userAns }) => {
      const userDisplay = q.type === 'mc'
        ? (userAns !== null ? `${userAns + 1}번` : '(미응답)')
        : (userAns || '(미응답)');
      const correctDisplay = q.type === 'mc'
        ? `${q.answer + 1}번 (${q.options[q.answer]})`
        : q.answer[0];
      msg += `\n• 문제 ${idx + 1} (${q.typeLabel})\n  내 답: ${userDisplay}\n  정답: ${correctDisplay}\n`;
    });
  } else {
    msg += `🎉 전부 정답! 완벽합니다!\n`;
  }
  msg += `\n수고했습니당 ~~~ ㅎㅎㅎ`;

  navigator.clipboard.writeText(msg).then(() => {
    showToast('✅ 복사 완료! 카카오톡에 붙여넣으세요');
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = msg;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('✅ 복사 완료! 카카오톡에 붙여넣으세요');
  });
}

render();
</script>
</body>
</html>
